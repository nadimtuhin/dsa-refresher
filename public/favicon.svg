<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#d71921"/>
  <!-- a tiny binary tree: the book's mark, bold enough to read at 16px -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="32" y1="18" x2="17" y2="45"/>
    <line x1="32" y1="18" x2="47" y2="45"/>
  </g>
  <circle cx="32" cy="16" r="8" fill="#ffffff"/>
  <circle cx="17" cy="47" r="8" fill="#ffffff"/>
  <circle cx="47" cy="47" r="8" fill="#ffffff"/>
</svg>
